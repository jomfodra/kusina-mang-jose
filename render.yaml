services:
  - type: web
    name: kusina-mang-jose-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    healthCheckInterval: 300
    maxNonRequestsProcessGracefulShutdownWaitSeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        scope: all
      - key: SUPABASE_ANON_KEY
        scope: all
      - key: SUPABASE_SERVICE_ROLE_KEY
        scope: all
